# See build framework documentation for a detailed explanation of all available switches:
# https://docs.armbian.com/Developer-Guide_Build-Switches/

# WiRoc "esp32" variant: uses an ESP32-SPI module (esp32_spi) for WiFi/BT.
# The on-board BCM43438 Bluetooth is not used.

MAINTAINER="Henrik Larsson"
MAINTAINERMAIL="henrik.larsson@chenfei.se"

BOARD=nanopiair
BRANCH=current       # Use _current_ branch which equals to latest available Linux LTS kernel
RELEASE=trixie	     # Use Debian trixie userspace
KERNEL_CONFIGURE=no  # skip dialog prompt for adjusting the Linux kernel configuration
INSTALL_HEADERS=yes  # Install Linux kernel headers while building. Can be useful for 3rd party drivers
SHARE_LOGS=yes       # Upload logs to Armbian's paste service to share with developers
BUILD_DESKTOP=no     # Do not install a graphical desktop environment
BUILD_MINIMAL=no     # Install common CLI utils

ENABLE_EXTENSIONS=preset-firstrun # add settings to .not_logged_in_yet file to create user, connect to network

INCLUDE_HOME_DIR=yes # keep /home/* (the WiRoc stack lives in /home/chip) in the final image

IMAGE_VERSION="25.11.0-trunk-esp32" # distinct image filename suffix
WIROC_VARIANT="esp32"               # ESP32-SPI module (spi-enable overlay + esp32_spi)
WIROC_HW_VERSION="v8Rev2"           # hardware version baked into /home/chip/settings.yaml (override on cmdline, e.g. ./compile.sh wiroc-esp32 WIROC_HW_VERSION=v9Rev1)
WIROC_PYTHON_VERSION="1.46"         # WiRoc-Python-2 release baked into /home/chip/settings.yaml (override on cmdline, e.g. ./compile.sh wiroc-esp32 WIROC_PYTHON_VERSION=1.47)

COMPRESS_OUTPUTIMAGE="sha,xz"       # xz-compress the .img (produces .img.xz) and write a .sha256
IMAGE_XZ_COMPRESSION_RATIO="9e"     # maximum xz compression (preset 9 + --extreme); use "9" if RAM is tight

# advanced

# Use build host DNS server inside chroot instead of default 1.0.0.1
NAMESERVER=$(grep nameserver /etc/resolv.conf|awk '{ print $2 }'| head -n 1)
